name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Python and isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 python3-venv bubblewrap libcap2-bin
          python3 -m venv "$RUNNER_TEMP/workflow-venv"
          "$RUNNER_TEMP/workflow-venv/bin/python" -m pip install --require-hashes -r requirements.lock
      - name: Diagnose and probe unchanged collector confinement
        run: |
          "$RUNNER_TEMP/workflow-venv/bin/python" -B tools/collector_diagnostics.py --output "$RUNNER_TEMP/ci-evidence"
      - name: Required supported-host suite
        run: |
          "$RUNNER_TEMP/workflow-venv/bin/python" -B -m unittest discover -s controller/tests -v
      - name: Preserve namespace diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-diagnostics
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
