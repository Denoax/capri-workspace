name: Companion unit checks
on:
  push:
    branches: ['testing/capri-desktop-v1-*', 'testing/capri-desktop-v2-*']
  pull_request:
    paths: ['companion/**', '.github/workflows/companion.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
        working-directory: companion
      - name: Broker, history, provider fixtures and deferred media state
        run: python -B -m unittest discover -s tests -v
        working-directory: companion
      # Native Hyprland, systemd-user and isolation acceptance are separate host evidence.
