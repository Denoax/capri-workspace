<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPRI — cloud takeover hero</title><style>:root{color-scheme:light dark}body{margin:0;font:16px/1.5 system-ui}main{max-width:1000px;margin:24px auto;padding:0 16px}img,video{display:block;width:100%;height:auto}nav{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}button{font:inherit;padding:6px 12px}a{color:inherit}video{margin-top:12px}small{display:block;margin-top:12px}</style><main><h1>CAPRI — Agentic Loop Prompting</h1><picture id="encoded"><source media="(prefers-reduced-motion: reduce)" srcset="../hero.png"><img id="hero" src="../hero.gif" alt="Authored ten-second cloud/terminal takeover. Capri glitches briefly, sparks, and the blue scene becomes magenta and green."></picture><nav><button id="motion">Pause GIF</button><button id="replay">Replay GIF</button><a href="../../../README.md">Repository README</a><a href="../source-match/companion/index.html">Lesson companion</a></nav><small>Actual GitHub GIF above. The offline video master below uses the same seekable scene and clock. The portrait is a generated fan-art reconstruction; no runtime/model result is depicted.</small><video id="master" controls loop muted playsinline preload="metadata" poster="../hero.png" src="master.mp4"></video></main><script>const im=document.getElementById('hero'),picture=document.getElementById('encoded'),button=document.getElementById('motion'),reduce=matchMedia('(prefers-reduced-motion:reduce)');let paused=reduce.matches;function pause(value){paused=value;picture.querySelector('source').srcset='../hero.png';picture.querySelector('source').media=value?'all':'not all';im.src=value?'../hero.png':'../hero.gif?play='+Date.now();button.textContent=value?'Play GIF':'Pause GIF';}button.onclick=()=>pause(!paused);document.getElementById('replay').onclick=()=>pause(false);reduce.addEventListener('change',()=>{pause(reduce.matches);if(reduce.matches)document.getElementById('master').pause();});if(reduce.matches)pause(true);</script></html>
